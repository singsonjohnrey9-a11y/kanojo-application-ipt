# Render Blueprint — deploys both backend and frontend
# See: https://render.com/docs/blueprint-spec

services:
  # ─── Django Backend (Web Service) ───
  - type: web
    name: rentcebu-api
    runtime: python
    region: singapore  # closest to Cebu
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: rentcebu-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set this to your frontend URL after deploy
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ─── React Frontend (Static Site) ───
  - type: web
    name: rentcebu-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rentcebu-db
    region: singapore
    plan: free
